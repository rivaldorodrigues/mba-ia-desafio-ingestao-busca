[project]
name = "mba-ia-desafio-ingestao-busca"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-openai>=1.4.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "taskipy>=1.14.1",
    "basedpyright>=1.39.9",
    "pre-commit>=4.6.0",
    "detect-secrets>=1.5.0",
]

[tool.taskipy.tasks]
test = "uv run pytest"
format = "uv run ruff format ."
lint = "uv run ruff check ."
fix = "uv run ruff check --fix ."
fix-changed = "files=$( (git diff --name-only --diff-filter=ACMRT HEAD -- '*.py'; git ls-files --others --exclude-standard -- '*.py') | sort -u ); [ -z \"$files\" ] && echo 'No changed Python files' || uv run ruff check --fix $files"
compile = "uv run python -m compileall app/ tests/ -q && echo '✓ Compilation check passed'"
typecheck = "uv run basedpyright --level error app/ && echo '✓ Type check passed'"
check = "task lint && task compile && task typecheck"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",                          # Verbose output
    "--tb=short",                  # Short traceback format
    "--strict-markers",            # Enforce marker registration
    "--disable-warnings",
    "-m", "not integration",
    "--cov=app",
    "--cov-report=xml",
    "--cov-report=term",
    "--cov-report=html",
]
markers = [
    "unit: Unit tests (fast, isolated)",
    "integration: Integration tests (slower, requires files)",
    "slow: Slow tests (skip with -m 'not slow')",
    "asyncio: marks tests as async",
]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (logging setup needs to run first)
    "N815",   # mixedCase variable in class scope (API entities use camelCase)
    "N803",   # argument name should be lowercase (API uses camelCase)
    "N806",   # variable in function should be lowercase (test mocks)
    "B008",   # do not perform function calls in argument defaults (FastAPI pattern)
    "B904",   # rise from err (not always needed)
    "SIM112", # use capitalized env vars (IBM Cirrus uses lowercase)
    "PLR6301",  # Method could be a function, class method, or static method
]

# Exclude directories
exclude = [
    ".eggs",
    ".git",
    ".venv",
    ".langgraph_api",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["app"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true
